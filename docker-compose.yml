services:
  backend:
    build:
      context: ./backend
    container_name: tenderflow-backend
    env_file:
      - ./backend/.env
    environment:
      # Allow the container hostname plus localhost for browser/proxy access.
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3005,http://127.0.0.1:3005
    volumes:
      # Persist the SQLite database and uploaded media on the host.
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        # Baked into the client bundle at build time; points at the published backend port.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: tenderflow-frontend
    ports:
      - "3005:3005"
    depends_on:
      - backend
    restart: unless-stopped
