services:
  backend:
    build:
      context: ./backend
    container_name: tenderflow-backend
    env_file:
      - ./backend/.env
    
    # Allow the container hostname plus localhost for browser/proxy access.
      
    volumes:
      # Persist the SQLite database and uploaded media on the host.
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        # Baked into the client bundle at build time; points at the published backend port.
        NEXT_PUBLIC_API_URL: https://str.ec2.alluvium.net
        # Must match the basePath in next.config.ts and the nginx location prefix.
        NEXT_PUBLIC_BASE_PATH: /tenderflow
    container_name: tenderflow-frontend
    ports:
      - "3005:3005"
    depends_on:
      - backend
    restart: unless-stopped
