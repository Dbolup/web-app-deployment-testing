image: node:20-alpine

options:
  size: 2x
  max-time: 30

definitions:
  caches:
    pipcache: ~/.cache/pip
    nextcache: .next/cache

  steps:
    - step: &frontend
        name: Frontend - Lint & Build
        image: node:20-alpine
        caches:
          - node
          - nextcache
        script:
          - apk add --no-cache libc6-compat
          - npm ci
          - npm run lint || true
          - export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://str.ec2.alluvium.net}"
          - export NEXT_PUBLIC_BASE_PATH="${NEXT_PUBLIC_BASE_PATH:-/tenderflow}"
          - export NEXT_TELEMETRY_DISABLED=1
          - npm run build
        artifacts:
          - .next/**

    - step: &backend
        name: Backend - Checks
        image: python:3.12-slim
        caches:
          - pipcache
        script:
          - cd backend
          - pip install -r requirements.txt
          - export DEBUG=False
          - export SECRET_KEY=ci-only-not-a-real-secret
          - export ALLOWED_HOSTS=localhost,127.0.0.1
          - python manage.py check
          - python manage.py makemigrations --check --dry-run

    - step: &deploy-test
        name: Deploy to Test environment
        image: alpine:3.22
        deployment: test
        clone:
          enabled: false
        max-time: 40
        script:
          - apk add --no-cache openssh-client openssh-keygen
          - |
            set -e
            for v in SSH_PRIVATE_KEY_B64 KNOWN_HOSTS_B64 SSH_HOST SSH_USER DEPLOY_PATH; do
              [ -n "$(printenv "$v")" ] || { echo "MISSING: $v is not set on the '$BITBUCKET_DEPLOYMENT_ENVIRONMENT' environment."; exit 1; }
            done
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\n\r \t' | base64 -d > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            printf '%s' "$KNOWN_HOSTS_B64" | tr -d '\n\r \t' | base64 -d > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          - >
            ssh -i ~/.ssh/id_ed25519
            -p "${SSH_PORT:-22}"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            "$SSH_USER@$SSH_HOST"
            "set -e &&
            cd '$DEPLOY_PATH' &&
            git fetch --all --prune &&
            git reset --hard &&
            git checkout -B '$BITBUCKET_BRANCH' '$BITBUCKET_COMMIT' &&
            docker compose up -d --build &&
            docker compose ps &&
            docker image prune -f"
          - echo "Deployed ${BITBUCKET_BRANCH}@${BITBUCKET_COMMIT}"

pipelines:
  default:
    - parallel:
        - step: *frontend
        - step: *backend

  branches:
    "feat/backed-nd-integration":
      - parallel:
          - step: *frontend
          - step: *backend
      - step: *deploy-test

  pull-requests:
    "**":
      - parallel:
          - step: *frontend
          - step: *backend
